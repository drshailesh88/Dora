version: '3.8'

services:
  # ============================================================================
  # Dora API Service
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dora-api:latest
    container_name: dora-api
    ports:
      - "8000:8000"
    environment:
      # API Settings
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=true

      # Database connections
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=docassist123
      - REDIS_URL=redis://redis:6379/0

      # LLM Settings (override in .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}

      # Embedding Model
      - EMBEDDING_MODEL=pritamdeka/BioBERT-mnli-snli-scinli-scitail-mednli-stsb
      - EMBEDDING_DEVICE=cpu

      # Feature Flags
      - USE_CLOUD_LLM=true
      - USE_LOCAL_LLM=false
      - USE_RERANKER=true

      # Security
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # Payments
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}

      # Notifications
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}

    volumes:
      # Code for hot-reload in development
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./logs:/app/logs

    depends_on:
      - qdrant
      - redis

    networks:
      - dora-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # Qdrant Vector Database
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: dora-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - dora-network
    restart: unless-stopped

  # ============================================================================
  # Neo4j Graph Database (Optional)
  # ============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: dora-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/docassist123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - dora-network
    restart: unless-stopped
    profiles:
      - full

  # ============================================================================
  # Redis Cache & Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: dora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - dora-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # PostgreSQL (for production, optional)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: dora-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=dora
      - POSTGRES_USER=dora
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dora_dev_password}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dora-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

  # ============================================================================
  # Nginx Reverse Proxy (for production-like setup)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: dora-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - dora-network
    restart: unless-stopped
    profiles:
      - full

# ============================================================================
# Volumes
# ============================================================================
volumes:
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  nginx_logs:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  dora-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
