[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/app/logs
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# Main API server
[program:api]
command=uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers 4
directory=/app
user=dora
autostart=true
autorestart=true
stdout_logfile=/app/logs/api.log
stderr_logfile=/app/logs/api_error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=PYTHONUNBUFFERED="1"
priority=100

# Background worker (for async tasks)
[program:worker]
command=python -m src.workers.celery_worker
directory=/app
user=dora
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker.log
stderr_logfile=/app/logs/worker_error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=PYTHONUNBUFFERED="1"
priority=200
numprocs=2
process_name=%(program_name)s_%(process_num)02d

# Scheduled tasks (cron-like)
[program:scheduler]
command=python -m src.workers.scheduler
directory=/app
user=dora
autostart=true
autorestart=true
stdout_logfile=/app/logs/scheduler.log
stderr_logfile=/app/logs/scheduler_error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
priority=300

# Metrics exporter
[program:metrics]
command=python -m src.monitoring.exporter
directory=/app
user=dora
autostart=true
autorestart=true
stdout_logfile=/app/logs/metrics.log
stderr_logfile=/app/logs/metrics_error.log
environment=PYTHONUNBUFFERED="1"
priority=400

[group:dora]
programs=api,worker,scheduler,metrics
priority=999
