version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ============================================================================
  # API - Production Configuration
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: dora-api:production

    # Production environment
    environment:
      - DEBUG=false
      - API_HOST=0.0.0.0
      - API_PORT=8000

      # Use GPU if available
      - EMBEDDING_DEVICE=cuda

      # Production security
      - SECRET_KEY=${SECRET_KEY}  # Must be set in .env
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - SENTRY_DSN=${SENTRY_DSN:-}

      # Performance
      - WORKERS=4
      - WORKER_CLASS=uvicorn.workers.UvicornWorker
      - MAX_REQUESTS=1000
      - MAX_REQUESTS_JITTER=100

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # No hot-reload in production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - model_cache:/app/models

    # Production command with gunicorn
    command: >
      gunicorn src.api.app:app
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 120
      --graceful-timeout 30
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      --log-level info

    restart: always

    # Stricter health checks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ============================================================================
  # Qdrant - Production Configuration
  # ============================================================================
  qdrant:
    environment:
      - QDRANT__LOG_LEVEL=WARN
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=32
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    restart: always

  # ============================================================================
  # Neo4j - Production Configuration
  # ============================================================================
  neo4j:
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_logs_query_enabled=false
      - NEO4J_dbms_logs_query_threshold=5s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
        reservations:
          cpus: '1'
          memory: 3G

    restart: always
    profiles: []  # Enable by default in production

  # ============================================================================
  # Redis - Production Configuration
  # ============================================================================
  redis:
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --requirepass ${REDIS_PASSWORD}

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

    restart: always

  # ============================================================================
  # PostgreSQL - Production Configuration
  # ============================================================================
  postgres:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C

    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=200

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    restart: always
    profiles: []  # Enable by default in production

  # ============================================================================
  # Nginx - Production Configuration
  # ============================================================================
  nginx:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    restart: always
    profiles: []  # Enable by default in production

# ============================================================================
# Additional Production Volumes
# ============================================================================
volumes:
  model_cache:
    driver: local

# ============================================================================
# Production Logging Configuration
# ============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "service,environment"
    tag: "{{.Name}}/{{.ID}}"

# Apply logging to all services
# You can override per-service by adding:
# logging:
#   <<: *default-logging
