apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dora-ingress
  namespace: dora
  labels:
    app: dora
  annotations:
    # Nginx Ingress Controller
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Security
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"  # Configure properly in production
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

    # Body size (for file uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    # Additional headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

spec:
  tls:
  - hosts:
    - dora.docassist.in
    - api.dora.docassist.in
    secretName: dora-tls-cert

  rules:
  # Main domain
  - host: dora.docassist.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dora-api
            port:
              number: 8000

  # API subdomain
  - host: api.dora.docassist.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dora-api
            port:
              number: 8000

---
# Alternative: Traefik Ingress
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: dora-ingressroute
  namespace: dora
  labels:
    app: dora
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`dora.docassist.in`)
    kind: Rule
    services:
    - name: dora-api
      port: 8000
    middlewares:
    - name: dora-ratelimit
    - name: dora-headers

  tls:
    certResolver: letsencrypt
    domains:
    - main: dora.docassist.in
      sans:
      - api.dora.docassist.in

---
# Traefik Middleware for rate limiting
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: dora-ratelimit
  namespace: dora
spec:
  rateLimit:
    average: 100
    burst: 50

---
# Traefik Middleware for security headers
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: dora-headers
  namespace: dora
spec:
  headers:
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"
      X-Content-Type-Options: "nosniff"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
    sslRedirect: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
