apiVersion: v1
kind: Service
metadata:
  name: dora-api
  namespace: dora
  labels:
    app: dora
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: dora
    component: api

---
apiVersion: v1
kind: Service
metadata:
  name: dora-qdrant
  namespace: dora
  labels:
    app: dora
    component: qdrant
spec:
  type: ClusterIP
  ports:
  - port: 6333
    targetPort: http
    protocol: TCP
    name: http
  - port: 6334
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    app: dora
    component: qdrant
  clusterIP: None  # Headless service for StatefulSet

---
apiVersion: v1
kind: Service
metadata:
  name: dora-neo4j
  namespace: dora
  labels:
    app: dora
    component: neo4j
spec:
  type: ClusterIP
  ports:
  - port: 7474
    targetPort: http
    protocol: TCP
    name: http
  - port: 7687
    targetPort: bolt
    protocol: TCP
    name: bolt
  selector:
    app: dora
    component: neo4j
  clusterIP: None  # Headless service for StatefulSet

---
apiVersion: v1
kind: Service
metadata:
  name: dora-redis
  namespace: dora
  labels:
    app: dora
    component: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: redis
    protocol: TCP
    name: redis
  selector:
    app: dora
    component: redis
