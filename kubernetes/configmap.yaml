apiVersion: v1
kind: ConfigMap
metadata:
  name: dora-config
  namespace: dora
  labels:
    app: dora
data:
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Database Connections
  QDRANT_HOST: "dora-qdrant"
  QDRANT_PORT: "6333"
  NEO4J_URI: "bolt://dora-neo4j:7687"
  NEO4J_USER: "neo4j"
  REDIS_URL: "redis://dora-redis:6379/0"

  # Embedding Model
  EMBEDDING_MODEL: "pritamdeka/BioBERT-mnli-snli-scinli-scitail-mednli-stsb"
  EMBEDDING_DEVICE: "cpu"

  # Feature Flags
  USE_CLOUD_LLM: "true"
  USE_LOCAL_LLM: "false"
  USE_RERANKER: "true"

  # Security
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
