# Kubernetes Secrets Template
# DO NOT commit actual secrets to version control!
# Use kubectl create secret or sealed-secrets in production

apiVersion: v1
kind: Secret
metadata:
  name: dora-secrets
  namespace: dora
  labels:
    app: dora
type: Opaque
stringData:
  # API Keys (base64 encode in production)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  COHERE_API_KEY: ""

  # Security
  SECRET_KEY: "CHANGE-THIS-TO-SECURE-RANDOM-KEY"

  # Database Passwords
  NEO4J_PASSWORD: "docassist123"
  POSTGRES_PASSWORD: "dora_production_password"
  REDIS_PASSWORD: "redis_production_password"

  # Payment Gateway
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""

  # Notifications
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  SENDGRID_API_KEY: ""

  # Monitoring
  SENTRY_DSN: ""

---
# Example: Create secrets from command line
# kubectl create secret generic dora-secrets \
#   --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
#   --from-literal=OPENAI_API_KEY=sk-... \
#   --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#   --namespace=dora
